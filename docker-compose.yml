version: "3.9"

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────
  command-service:
    build: ./command-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/quizdb
    depends_on:
      postgres:
        condition: service_healthy

  query-service:
    build: ./query-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/quizdb
    depends_on:
      postgres:
        condition: service_healthy

  # ── Front-end apps ────────────────────────────────────────────────────────
  # Note: NEXT_PUBLIC_* and EXPO_PUBLIC_* URLs use localhost because API calls
  # are made from the user's browser, not from inside the Docker network.

  admin-app:
    build:
      context: .
      dockerfile: apps/admin-app/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_QUERY_URL: http://localhost:8002
      NEXT_PUBLIC_COMMAND_URL: http://localhost:8001
    depends_on:
      - command-service
      - query-service

  user-app:
    build:
      context: .
      dockerfile: apps/user-app/Dockerfile
    ports:
      - "8081:8081"
    environment:
      CI: "1"
      EXPO_PUBLIC_QUERY_URL: http://localhost:8002
      EXPO_PUBLIC_COMMAND_URL: http://localhost:8001
    depends_on:
      - command-service
      - query-service

volumes:
  postgres_data:
